[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencti-galileo-signals"
version = "0.1.0"
description = "OpenCTI external-import connector for Galileo Signals observed-domain indicators"
requires-python = ">=3.10"
dependencies = [
  "pycti>=6.0,<7",
  "requests>=2.31,<3",
  "stix2>=3.0,<4",
  "PyYAML>=6.0,<7",
]

[project.scripts]
opencti-galileo-signals = "opencti_galileo_signals.connector:main"

[tool.setuptools]
packages = ["opencti_galileo_signals"]
